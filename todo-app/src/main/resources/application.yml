spring:
  application:
    name: todo-app

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.eprbcxktfsxprmkhxjlp.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Supabase already has a schema, use validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

# JWT Configuration (For Supabase integration, set JWT_SECRET to your Supabase Project JWT Secret from Settings -> API)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-replace-this-with-a-real-secret-at-least-32-chars}
  expiration: 86400000            # 24 hours (ms)
  refresh-expiration: 604800000   # 7 days (ms)

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.todoapp: DEBUG
    org.springframework.security: DEBUG
