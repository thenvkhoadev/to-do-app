spring:
  application:
    name: todo-app

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Supabase already has a schema, use validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration (For Supabase integration, set JWT_SECRET to your Supabase Project JWT Secret from Settings -> API)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours (ms)
  refresh-expiration: 604800000 # 7 days (ms)

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET:${JWT_SECRET}}

# Server
server:
  port: 8080
  error:
    include-message: always

# Logging
logging:
  level:
    com.todoapp: DEBUG
    org.springframework.security: DEBUG
